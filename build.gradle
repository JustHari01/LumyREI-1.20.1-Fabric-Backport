plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.1.21'
}

version = project.mod_version

group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://libraries.minecraft.net/" }

    maven { url "https://maven.shedaniel.me" }

    maven {
        name "Cobblemon"
        url "https://maven.impactdev.net/repository/development/"
    }
}

dependencies {

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
}

processResources {

    inputs.property "baseVersion", project.mod_version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.baseVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

fabricApi {
    configureDataGeneration()
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE")
    from("ATTRIBUTION.md")
}
